
name: CI

on:
  push:
    branches:
      - khushi-ingestion
  pull_request:
    branches:
      - khushi-ingestion

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: cognistream
      CLICKHOUSE_PASSWORD: cognistream_dev
      CLICKHOUSE_DB: cognistream

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start ClickHouse
        run: docker compose up -d clickhouse

      - name: Wait for ClickHouse
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8123/ping | grep -q "Ok"; then
              echo "ClickHouse is ready"
              break
            fi
            sleep 2
          done

      - name: Run tests
        run: pytest
